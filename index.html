
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R78 Football Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #071426;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

h1 {
    color: #38aaff;
    letter-spacing: 2px;
}

.game {
    max-width: 500px;
    margin: auto;
}

.pitch {
    position: relative;
    height: 310px;
    background: repeating-linear-gradient(
        0deg,
        #168344,
        #168344 50px,
        #11743a 50px,
        #11743a 100px
    );
    border: 4px solid white;
    border-radius: 12px;
    overflow: hidden;
}

.goal {
    position: absolute;
    top: 8px;
    left: 25%;
    width: 50%;
    height: 110px;
    border: 6px solid white;
    border-bottom: 3px solid white;
    background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        #ffffff44 11px
    );
}

.keeper {
    position: absolute;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 48px;
    transition: left 0.45s ease, transform 0.45s ease;
    z-index: 2;
}

.ball {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 35px;
    transition: all 0.55s ease;
    z-index: 3;
}

.ball.shoot-left {
    left: 32%;
    bottom: 205px;
    transform: translateX(-50%) scale(0.7);
}

.ball.shoot-center {
    left: 50%;
    bottom: 205px;
    transform: translateX(-50%) scale(0.7);
}

.ball.shoot-right {
    left: 68%;
    bottom: 205px;
    transform: translateX(-50%) scale(0.7);
}

.controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0;
}

button {
    background: #168cff;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

#message {
    min-height: 30px;
    font-size: 20px;
    font-weight: bold;
    color: #ffd84d;
}

#restart {
    background: #13a05b;
    display: none;
}

.score {
    font-size: 18px;
    margin: 15px;
}
</style>

<meta name="google-site-verification" content="5SkJGSHTn2AAqjC2-G3PYamhs6UyxvnThmpKX-sYuuQ" />

</head>

<body>

<div class="game">
    <h1>R78 FOOTBALL GAME</h1>
    <p>Penalty Shootout ⚽</p>

    <div class="score">
        Goals: <span id="score">0</span> |
        Shots: <span id="shots">0</span>/5
    </div>

    <div class="pitch">
        <div class="goal"></div>
        <div class="keeper" id="keeper">🧤</div>
        <div class="ball" id="ball">⚽</div>
    </div>

    <div class="controls">
        <button onclick="shoot('left')">LEFT</button>
        <button onclick="shoot('center')">CENTER</button>
        <button onclick="shoot('right')">RIGHT</button>
    </div>

    <div id="message">Choose your shot!</div>

    <button id="restart" onclick="restartGame()">PLAY AGAIN</button>
</div>

<script>
let score = 0;
let shots = 0;
let playing = true;

function shoot(direction) {
    if (!playing) return;

    playing = false;

    const ball = document.getElementById("ball");
    const keeper = document.getElementById("keeper");
    const message = document.getElementById("message");

    const directions = ["left", "center", "right"];
    const keeperDirection =
        directions[Math.floor(Math.random() * 3)];

    ball.className = "ball";
    void ball.offsetWidth;
    ball.classList.add("shoot-" + direction);

    keeper.style.left =
        keeperDirection === "left" ? "30%" :
        keeperDirection === "right" ? "70%" : "50%";

    keeper.style.transform =
        keeperDirection === "center"
        ? "translateX(-50%) scale(1.2)"
        : "translateX(-50%) rotate(" +
          (keeperDirection === "left" ? "-35deg" : "35deg") + ")";

    shots++;

    setTimeout(() => {
        if (direction !== keeperDirection) {
            score++;
            message.textContent = "GOOOAL! 🔥";
        } else {
            message.textContent = "SAVED! 🧤";
        }

        document.getElementById("score").textContent = score;
        document.getElementById("shots").textContent = shots;

        if (shots >= 5) {
            playing = false;
            document.getElementById("restart").style.display = "inline-block";
            message.textContent += " Match Over! Final Score: " + score + "/5";
        } else {
            playing = true;
        }
    }, 600);
}

function restartGame() {
    score = 0;
    shots = 0;
    playing = true;

    document.getElementById("score").textContent = 0;
    document.getElementById("shots").textContent = 0;
    document.getElementById("message").textContent = "Choose your shot!";
    document.getElementById("restart").style.display = "none";

    document.getElementById("ball").className = "ball";

    const keeper = document.getElementById("keeper");
    keeper.style.left = "50%";
    keeper.style.transform = "translateX(-50%)";
}
</script>

</body>
</html>
